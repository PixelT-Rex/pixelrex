<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>PixelRex — Dino World</title>
    <meta name="description" content="A pixel-art dinosaur survival game. Hunt, gather, trade and level up across an open Cretaceous valley. Built with Vite + React + Phaser." />

    <!-- favicon / app icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PixelRex" />
    <meta property="og:title" content="PixelRex — Dino World" />
    <meta property="og:description" content="A pixel-art dinosaur survival game. Hunt, gather, trade and level up across an open Cretaceous valley." />
    <meta property="og:url" content="https://pixelrex.vercel.app/" />
    <meta property="og:image" content="https://pixelrex.vercel.app/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PixelRex — Dino World" />
    <meta name="twitter:description" content="A pixel-art dinosaur survival game built with Phaser." />
    <meta name="twitter:image" content="https://pixelrex.vercel.app/social-preview.png" />
    <style>
      html, body, #root {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #0d1014; overflow: hidden;
        font-family: 'Courier New', 'Menlo', monospace; color: #e8e3d3;
      }
      #game-root { position: absolute; inset: 0; }
      #hud-root { position: absolute; inset: 0; z-index: 10; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
      #boot {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #6dbf5a; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">Loading the Cretaceous…</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
